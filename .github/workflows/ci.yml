name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Built app smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure smoke scratch
        run: |
          scratch="$RUNNER_TEMP/saveeditor/test-scratch/e2e-smoke"
          mkdir -p "$scratch"
          {
            echo "SAVETOOLKIT_E2E_SCRATCH=$scratch"
            echo "PLAYWRIGHT_BROWSERS_PATH=$scratch/browsers"
            echo "TEMP=$scratch"
            echo "TMP=$scratch"
            echo "TMPDIR=$scratch"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build API (Release)
        run: dotnet build src/SaveToolkit.Api/SaveToolkit.Api.csproj --configuration Release
      - name: Install web dependencies and build bundled UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run built app smoke tests
        working-directory: web
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ env.SAVETOOLKIT_E2E_SCRATCH }}/playwright-report
          if-no-files-found: warn
          retention-days: 14

  script-tests:
    name: Script regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell script regressions
        shell: pwsh
        run: ./scripts/self-test.ps1 -ScratchDirectory "${{ runner.temp }}/script-tests"

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SAVETOOLKIT_ARTIFACTS: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate workflows
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Documentation checks
        if: runner.os == 'Linux'
        shell: bash
        run: python3 docs/tests/test_documentation.py
      - name: Backend build and every test project (without samples)
        env:
          SAVETOOLKIT_TEST_TEMP: ${{ runner.temp }}/savetoolkit-tests
        run: ./scripts/test.ps1 -Configuration Release -ResultsDirectory "${{ runner.temp }}/test-results/backend"
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Web lint when configured, typecheck, tests and build
        working-directory: web
        run: |
          npm run lint --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile="${{ runner.temp }}/test-results/web.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          @"
          ### Validation: ${{ matrix.os }} — $env:JOB_STATUS
          Backend: warnings as errors; every test project; private samples absent (expected skips).
          Web: optional lint, TypeScript, Vitest and production build.
          Download test-results-${{ runner.os }} for per-project TRX and web JUnit reports.
          "@ >> $env:GITHUB_STEP_SUMMARY
