name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      backend_filter:
        description: 'Optional backend project path/name substring (blank runs every project); other gates always run'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Protected invocations get a unique group: cancel-in-progress:false alone still replaces pending runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.workflow == 'CI' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'CI' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main')) }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  e2e:
    name: Built app smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure smoke scratch
        run: |
          scratch="$RUNNER_TEMP/saveeditor/test-scratch/e2e-smoke"
          mkdir -p "$scratch"
          {
            echo "SAVETOOLKIT_E2E_SCRATCH=$scratch"
            echo "PLAYWRIGHT_BROWSERS_PATH=$scratch/browsers"
            echo "TEMP=$scratch"
            echo "TMP=$scratch"
            echo "TMPDIR=$scratch"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            .config/dotnet-tools.json
            **/*.csproj
            **/packages.lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build API (Release)
        run: dotnet build src/SaveToolkit.Api/SaveToolkit.Api.csproj --configuration Release
      - name: Install web dependencies and build bundled UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Cache Chromium binaries
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium
      - name: Install Chromium system dependencies (also on cache hits)
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Run built app smoke tests
        working-directory: web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ env.SAVETOOLKIT_E2E_SCRATCH }}/playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ env.SAVETOOLKIT_E2E_SCRATCH }}/e2e.xml
        run: npm run e2e -- --reporter=list,html,junit
      - name: Browser test summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -B .github/scripts/ci_summary.py --title 'Built app smoke (Chromium)' --junit "$SAVETOOLKIT_E2E_SCRATCH/e2e.xml"
      - name: Upload browser test counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e-${{ runner.os }}
          path: ${{ env.SAVETOOLKIT_E2E_SCRATCH }}/e2e.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ env.SAVETOOLKIT_E2E_SCRATCH }}/playwright-report
          if-no-files-found: warn
          retention-days: 14

  script-tests:
    name: Script regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            .config/dotnet-tools.json
            **/*.csproj
            **/packages.lock.json
      - name: PowerShell script regressions
        shell: pwsh
        run: ./scripts/self-test.ps1 -ScratchDirectory "${{ runner.temp }}/script-tests" 6>&1 | Tee-Object -FilePath "${{ runner.temp }}/script-tests.log"
      - name: Script test summary
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B .github/scripts/ci_summary.py --title 'Script regressions (${{ matrix.os }})' --script-log "${{ runner.temp }}/script-tests.log"
      - name: Upload script test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-scripts-${{ runner.os }}
          path: ${{ runner.temp }}/script-tests.log
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SAVETOOLKIT_ARTIFACTS: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare documentation ancestry ref
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/heads/main; then
            :
          elif git show-ref --verify --quiet refs/remotes/origin/main; then
            git branch main refs/remotes/origin/main
          else
            git fetch --no-tags origin main:refs/heads/main
          fi
          git show-ref --verify --quiet refs/heads/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            .config/dotnet-tools.json
            **/*.csproj
            **/packages.lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate workflows
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Documentation checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -B docs/tests/test_documentation.py
          python3 -B -m unittest discover -s .github/tests
      - name: Backend build and every test project (without samples)
        env:
          SAVETOOLKIT_TEST_TEMP: ${{ runner.temp }}/savetoolkit-tests
          # Reusable release validation always runs every project, including manual releases.
          BACKEND_FILTER: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'CI' && inputs.backend_filter || '' }}
        run: |
          # .NET coverage runs on Windows: on Linux the coverage extension adds ~105 s of fixed
          # startup per test process (21 projects exceeded the 40-minute job timeout in run 40815192793).
          ./scripts/test.ps1 -Configuration Release -ResultsDirectory "${{ runner.temp }}/test-results/backend" -Coverage:($IsWindows) -Filter $env:BACKEND_FILTER
      - name: Merge backend coverage and write assembly summary
        if: always() && runner.os == 'Windows'
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool run reportgenerator `
            "-reports:${{ runner.temp }}/test-results/backend/**/coverage.cobertura.xml" `
            "-targetdir:${{ runner.temp }}/test-results/coverage/backend" `
            '-reporttypes:Cobertura;MarkdownAssembliesSummary;Html' `
            '-assemblyfilters:-*.Tests;-SaveToolkit.Testing'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### .NET coverage (${{ runner.os }})" >> $env:GITHUB_STEP_SUMMARY
          Get-Content "${{ runner.temp }}/test-results/coverage/backend/Summary.md" >> $env:GITHUB_STEP_SUMMARY
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Web lint when configured, typecheck, tests and build
        working-directory: web
        run: |
          npm run lint --if-present
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coverageArgs = @()
          if ($IsLinux) {
            $coverageArgs = @('--coverage', '--coverage.reportsDirectory=${{ runner.temp }}/test-results/coverage/web')
          }
          npm test -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile="${{ runner.temp }}/test-results/web.xml" @coverageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Web bundle size budgets
        working-directory: web
        run: npm run check:bundle
      - name: Web coverage summary
        if: always() && runner.os == 'Linux'
        run: |
          $summary = '${{ runner.temp }}/test-results/coverage/web/summary.txt'
          if (Test-Path -LiteralPath $summary) {
            '### Web coverage (V8)' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $summary >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: |
            ${{ runner.temp }}/test-results/backend/**/coverage.cobertura.xml
            ${{ runner.temp }}/test-results/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: |
            ${{ runner.temp }}/test-results/backend/**/*.trx
            ${{ runner.temp }}/test-results/backend/project-timings.json
            ${{ runner.temp }}/test-results/web.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -B .github/scripts/ci_summary.py --title 'Validation (${{ matrix.os }})' --trx-directory "${{ runner.temp }}/test-results/backend" --junit "${{ runner.temp }}/test-results/web.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @"
          Backend: warnings as errors; private samples absent (expected skips); optional standalone manual filter.
          Web: optional lint, TypeScript, Vitest and production build.
          Download test-results-${{ runner.os }} for per-project TRX and web JUnit reports.
          "@ >> $env:GITHUB_STEP_SUMMARY
