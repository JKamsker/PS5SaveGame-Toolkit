name: Nightly Stryker (informational)

on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-stryker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker ${{ matrix.project }} (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [Core, Sdk]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      TESTINGPLATFORM_PIPE_DIRECTORY: /tmp
      MUTATION_PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure sample-free scratch and native MTP
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'stryker'
          New-Item -ItemType Directory -Force -Path $scratch, "$scratch/tests", "$scratch/empty-samples" | Out-Null
          "MUTATION_SCRATCH=$scratch" >> $env:GITHUB_ENV
          foreach ($variable in @('TEMP', 'TMP', 'TMPDIR')) {
            "$variable=$scratch" >> $env:GITHUB_ENV
          }
          "SAVETOOLKIT_TEST_TEMP=$scratch/tests" >> $env:GITHUB_ENV
          "SAVETOOLKIT_ARTIFACTS=$scratch/empty-samples" >> $env:GITHUB_ENV
          "SAVETOOLKIT_MUTATION_CONFIG=$scratch/mutation.testconfig.json" >> $env:GITHUB_ENV
          # Reuse the local sweep's supported MTP configuration link; no VSTest adapter.
          # Allocation, API hosting, fuzz and conformance tests remain ordinary CI checks.
          @{ commandLineOptions = @{ 'filter-not-class' = @(
            '*Allocation*', '*Api*', '*MutationFuzz*', '*Conformance*',
            '*SaveMutation*', '*TestScratch*', '*Documentation*'
          ) } } | ConvertTo-Json -Depth 5 | Set-Content "$scratch/mutation.testconfig.json"
          $config = Get-Content tests/stryker-config.json -Raw | ConvertFrom-Json
          $config.'stryker-config'.reporters = @('progress', 'html', 'json')
          $config | ConvertTo-Json -Depth 5 | Set-Content "$scratch/stryker-config.json"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            .config/dotnet-tools.json
            **/*.csproj
            **/packages.lock.json
      - name: Restore pinned Stryker.NET 5.0.0
        run: |
          # The manifest owns the exact version; restore never updates it.
          dotnet tool restore
          exit $LASTEXITCODE
      - name: Scope Stryker to the Core test project
        run: |
          # Solution mode prevents referenced plugin test projects joining Stryker discovery.
          # Normal project references still build; no production or test project is rewritten.
          dotnet new sln --name Stryker --format slnx --output "$env:MUTATION_SCRATCH"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet sln "$env:MUTATION_SCRATCH/Stryker.slnx" add --include-references false `
            src/SaveToolkit.Core/SaveToolkit.Core.csproj `
            src/SaveToolkit.Sdk/SaveToolkit.Sdk.csproj `
            tests/SaveToolkit.Core.Tests/SaveToolkit.Core.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Solution mode runs from scratch, with the same SDK and pinned local tools.
          Copy-Item global.json "$env:MUTATION_SCRATCH/global.json"
          Copy-Item .config/dotnet-tools.json "$env:MUTATION_SCRATCH/dotnet-tools.json"
      - name: Mutate production project with Core tests
        working-directory: ${{ runner.temp }}/stryker
        run: |
          dotnet stryker --config-file "$env:MUTATION_SCRATCH/stryker-config.json" `
            --solution "$env:MUTATION_SCRATCH/Stryker.slnx" `
            --project "SaveToolkit.$env:MUTATION_PROJECT.csproj" --mutate '**/*.cs' `
            --output "$env:MUTATION_SCRATCH/output" --skip-version-check
          exit $LASTEXITCODE
      - name: Summarize project mutation score
        if: always()
        run: |
          "### Stryker: SaveToolkit.$env:MUTATION_PROJECT" >> $env:GITHUB_STEP_SUMMARY
          $path = "$env:MUTATION_SCRATCH/output/reports/mutation-report.json"
          if (!(Test-Path -LiteralPath $path)) {
            'Report unavailable: mutation testing failed, timed out or was cancelled. See the job log.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
          $mutants = @($report.files.Values | ForEach-Object { $_.mutants })
          $detected = @($mutants | Where-Object { $_.status -in @('Killed', 'Timeout') }).Count
          $valid = @($mutants | Where-Object { $_.status -in @('Killed', 'Timeout', 'Survived', 'NoCoverage') }).Count
          $score = if ($valid) {
            (100.0 * $detected / $valid).ToString('F2', [Globalization.CultureInfo]::InvariantCulture) + '%'
          } else { 'N/A (no valid mutants)' }
          "Mutation score: **$score** ($detected detected / $valid valid)." >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          '| Status | Mutants |' >> $env:GITHUB_STEP_SUMMARY
          '| --- | ---: |' >> $env:GITHUB_STEP_SUMMARY
          foreach ($status in @('Killed', 'Timeout', 'Survived', 'NoCoverage', 'CompileError', 'Ignored', 'Pending')) {
            $count = @($mutants | Where-Object { $_.status -eq $status }).Count
            "| $status | $count |" >> $env:GITHUB_STEP_SUMMARY
          }
          '' >> $env:GITHUB_STEP_SUMMARY
          'Informational only. Native MTP is preview; compile-error/ignored mutants are excluded from the score. Inspect exclusions and the HTML report before interpreting results.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload HTML and JSON mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-${{ matrix.project }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stryker/output/reports/mutation-report.html
            ${{ runner.temp }}/stryker/output/reports/mutation-report.json
          if-no-files-found: warn
          retention-days: 3
