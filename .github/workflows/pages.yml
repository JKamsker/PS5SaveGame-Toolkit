name: Pages

# One GitHub Pages site per repository: the documentation stays at the project root
# (https://<owner>.github.io/<repo>/) and the in-browser app is published below APP_PATH
# (https://<owner>.github.io/<repo>/app/). Both are rebuilt and deployed together.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a running deployment; a newer pending run replaces an older pending one.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_PATH: app
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  docs:
    name: Documentation site
    uses: ./.github/workflows/docs.yml

  app:
    name: Build browser app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version reported by /api/version from tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            Directory.Build.props
            Directory.Build.targets
            .config/dotnet-tools.json
            **/*.csproj
            **/packages.lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install .NET WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Resolve the project Pages base path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # <owner>.github.io repositories are served from the domain root; all others below /<repo>/.
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then base="/$APP_PATH/"; else base="/$REPOSITORY_NAME/$APP_PATH/"; fi
          echo "SAVETOOLKIT_WEB_BASE=$base" >> "$GITHUB_ENV"
          echo "App base path: $base" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the static site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check the built site uses the base path
        run: |
          test -f web/dist/_framework/dotnet.js
          grep -q "src=\"${SAVETOOLKIT_WEB_BASE}assets/" web/dist/index.html
          cmp web/dist/index.html web/dist/404.html
      - name: Upload the built app
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [docs, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the documentation site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: ${{ runner.temp }}/pages
      - name: Refuse to overwrite documentation with the app
        run: test ! -e "$RUNNER_TEMP/pages/$APP_PATH"
      - name: Download the app below its sub-path
        uses: actions/download-artifact@v8
        with:
          name: web-app
          path: ${{ runner.temp }}/pages/${{ env.APP_PATH }}
      - name: Serve app deep links through the site's 404 page
        run: |
          # GitHub Pages only uses the 404.html at the site root, so the app's own copy of index.html
          # (web/dist/404.html) must live there for a reloaded /app/w/<id> to load the app. Its asset URLs
          # are absolute (SAVETOOLKIT_WEB_BASE); paths outside the app (such as a moved documentation page)
          # get a not-found page linking to the documentation home and the editor.
          test -f "$RUNNER_TEMP/pages/$APP_PATH/404.html"
          test ! -e "$RUNNER_TEMP/pages/404.html"
          cp "$RUNNER_TEMP/pages/$APP_PATH/404.html" "$RUNNER_TEMP/pages/404.html"
      - name: Read Pages configuration
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Upload the combined site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
