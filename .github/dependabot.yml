version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must equal the SQLitePCLRaw.bundle_e_sqlite3/provider version that Microsoft.Data.Sqlite
      # brings in; any standalone bump (even a patch, see #44) mixes core and native-provider
      # versions. Move the pin by hand together with Microsoft.Data.Sqlite.
      - dependency-name: SQLitePCLRaw.core
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
