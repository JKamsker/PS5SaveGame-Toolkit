version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the SQLitePCLRaw.bundle_e_sqlite3 that Microsoft.Data.Sqlite brings in; a major
      # bump mixes a 3.x core with the 2.x native provider. Move it together with Microsoft.Data.Sqlite.
      - dependency-name: SQLitePCLRaw.core
        update-types: ['version-update:semver-major']
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
